 ["Los tres procesos geológicos internos",diferenciasProcesosInternos],
 ["2. El magmatismo · el magma y sus componentes","El magma se forma cuando parte de la roca se funde en el interior terrestre. <strong>Fracción líquida.</strong> Es la roca fundida, rica en sílice. Puede empezar como pequeñas gotas que se unen y ascienden. <strong>Fracción sólida.</strong> Incluye cristales en suspensión, restos de roca sin fundir y fragmentos desprendidos de la roca encajante, que es la que rodea al magma. <strong>Fracción gaseosa.</strong> Son los gases disueltos en el fundido. Los más abundantes son el vapor de agua y el dióxido de carbono. El magma puede acumularse en una cámara magmática."],
 ["Emplazamientos intrusivos o en profundidad · plutón y dique","En un <strong>emplazamiento intrusivo</strong>, el magma se introduce entre rocas y se solidifica en el interior. <strong>Plutón.</strong> Es un cuerpo voluminoso de roca magmática, de forma ovoide o de cúpula. En el dibujo es la masa gris abovedada de la izquierda. <strong>Dique.</strong> Es una lámina de roca magmática, delgada en relación con su extensión. Se forma cuando el magma penetra en una fractura y, en el dibujo, se reconoce porque corta las capas de la roca que lo rodea. Para el examen, fíjate en esas dos formas."],
 ["3.3. Emplazamientos en superficie y estructuras volcánicas","La <strong>cámara magmática</strong> es la acumulación de magma en profundidad. La <strong>chimenea</strong> es el conducto por el que el magma asciende y el <strong>cráter</strong> es la abertura por la que salen los productos volcánicos. Los materiales que salen por el cráter se acumulan a su alrededor. Así se forma el <strong>cono o edificio volcánico</strong>. La <strong>caldera</strong> es una depresión amplia, generalmente circular, que suele formarse por el hundimiento del techo de la cámara magmática. La <strong>colada de lava</strong> es la lava que se extiende por la superficie."],
 ["3.1. Los volcanes · cómo se produce una erupción","Cuando el magma asciende, tiene menos roca encima y disminuye la <strong>presión</strong>. Los gases dejan de estar disueltos y forman burbujas, como al destapar una bebida gaseosa. El magma se vuelve espumoso y menos denso. Al empujar las rocas de encima, favorece la apertura de fracturas por las que puede llegar a la superficie y producir una erupción."],
 ["3.2. Los productos volcánicos","<strong>Gaseosos.</strong> Se emiten principalmente vapor de agua y dióxido de carbono. <strong>Líquidos.</strong> La lava es el magma que llega a la superficie y ha perdido parte de sus gases. <strong>Sólidos.</strong> Los piroclastos se clasifican por tamaño. La ceniza mide menos de 2 mm. El lapilli mide entre 2 y 64 mm. Las bombas volcánicas superan los 64 mm."],
 ["3.4. Tipos de actividad volcánica · factores","<strong>Composición.</strong> Cuanta más sílice contiene el magma, más le cuesta fluir. Es decir, tiene más <strong>viscosidad</strong>. <strong>Temperatura.</strong> El magma más caliente fluye con más facilidad. <strong>Cantidad de gases disueltos.</strong> Los gases disueltos tienden a aumentar la fluidez del magma. Al bajar la presión cerca de la superficie, parte del gas se separa del magma, forma burbujas y escapa. La salida de los gases se llama <strong>desgasificación</strong>. Si el magma es muy viscoso, los gases pueden salir de forma más violenta. <strong>Lugar.</strong> Bajo el agua, la lava se enfría bruscamente y puede formar lavas almohadilladas. En tierra se desgasifica y puede extenderse en coladas."]
 ],

{

 bloques:[
 ["4. Las rocas magmáticas o ígneas · dónde se forman","<strong>Plutónicas.</strong> El magma se enfría lentamente en profundidad y da tiempo a que crezcan los cristales. Los cristales suelen verse a simple vista. Juntos forman un <strong>mosaico de cristales</strong>: encajan como las piezas de un puzle. <strong>Volcánicas.</strong> Se forman a partir de materiales expulsados en una erupción. Al enfriarse rápidamente, tienen menos tiempo para formar cristales grandes. Por eso suele costar distinguir los minerales a simple vista. En el vidrio volcánico no se forman cristales. A veces se observan algunos cristales dispersos. <strong>Subvolcánicas o filonianas.</strong> Se forman a menor profundidad, cuando el magma se introduce en grietas, fallas o entre capas y se consolida allí, formando, por ejemplo, filones o diques."],
 ["4.1. Texturas de las rocas magmáticas · textura y estructura","La <strong>textura</strong> describe el tamaño y la forma de los granos minerales. Depende, entre otros factores, de la velocidad de enfriamiento. Un enfriamiento más lento da más tiempo para que crezcan los cristales. La <strong>estructura</strong> describe otros rasgos. Por ejemplo, si la roca tiene huecos o si sus minerales están orientados en una dirección. La <strong>porosidad</strong> indica cuánto espacio ocupan esos huecos."],
 ["Grado de cristalización","<strong>Fanerítica u holocristalina (fanerocristalina).</strong> Los cristales se distinguen a simple vista y encajan como piezas de un puzle. El granito es un ejemplo. <strong>Microcristalina.</strong> Cristales muy pequeños que todavía se aprecian a simple vista, como en la aplita. <strong>Vítrea.</strong> Masa homogénea sin cristales, como la obsidiana."],
 ["Tamaño y disposición","La textura <strong>porfídica</strong> tiene cristales grandes rodeados de material de grano muy fino o de aspecto vítreo. El material que rodea esos cristales se llama <strong>matriz</strong>. La <strong>vacuolar</strong> conserva huecos de burbujas de gas, como en la pumita y en algunas lavas solidificadas."],
 ["4.2. Tipos de rocas magmáticas · volcánicas","<strong>Pumita o piedra pómez.</strong> Vidrio volcánico espumoso, con muchas vacuolas y poca densidad. Puede flotar en el agua. <strong>Andesita.</strong> Suele ser gris o violácea. Tiene composición similar a la diorita, aunque se forma en la superficie. <strong>Obsidiana.</strong> Vidrio volcánico compacto y negro. Al romperse deja superficies curvas, llamadas fractura concoidea, y bordes cortantes. <strong>Basalto.</strong> Es oscuro y denso. A veces tiene vacuolas. Es característico de la corteza oceánica."],
 ["4.2. Tipos de rocas magmáticas · plutónicas y filonianas","<strong>Granito.</strong> Presenta cuarzo, feldespatos y micas visibles. <strong>Diorita.</strong> Roca oscura moteada de blanco, con plagioclasas y anfíboles. <strong>Sienita.</strong> Suele ser rosada o anaranjada, con abundante ortosa y sin cuarzo. <strong>Gabro.</strong> Roca oscura, cuyos minerales principales son piroxenos y plagioclasas. <strong>Pegmatita.</strong> Es filoniana y tiene una composición similar a la del granito, con cristales grandes de feldespato y mica."]
 ],

},
{
 id:"meta", titulo:"Metamorfismo", paginas:"296–299",
 idea:"Una roca puede cambiar sus minerales, su <strong>textura</strong> o su <strong>estructura</strong> por la presión o la temperatura. Durante el metamorfismo, la roca sigue en <strong>estado sólido</strong>.",
 bloques:[
 ["5.1. Factores del metamorfismo","<strong>Presión litostática.</strong> Es la presión debida al peso de las capas superiores. Reduce la porosidad y puede aumentar la densidad. <strong>Temperatura.</strong> Favorece las reacciones entre minerales y facilita la deformación. <strong>Esfuerzos dirigidos.</strong> Se deben al empuje de las placas. Pueden comprimir y orientar minerales o triturar la roca en una falla. <strong>Presencia de agua.</strong> El agua lleva <strong>iones disueltos</strong>. Estos pueden reaccionar con los minerales de la roca."],
 ["5.2. Cambios físicos · cambios en el aspecto de la roca","El <strong>color</strong> puede variar al cambiar los minerales y pueden aparecer bandas o vetas. La <strong>densidad</strong> puede aumentar si disminuyen los poros. La <strong>tenacidad</strong> es la resistencia a romperse. Aumenta si los granos quedan más unidos. La <strong>textura</strong> puede cambiar cuando crecen los cristales. Ese crecimiento se llama <strong>blastesis</strong>. La <strong>estructura</strong> cambia cuando los minerales se orientan y forman láminas o bandas."],
 ["5.3. Tipos de metamorfismo",tiposMetamorfismo],
 ["Serie regional · del ambiente sedimentario al magmático",serieRegionalCuaderno],
 ["6.1. Estructuras de las rocas metamórficas",estructurasMetamorficas],
 ["6.2. Tipos de rocas metamórficas · cómo reconocerlas","<strong>Pizarra.</strong> Se origina a partir de rocas arcillosas y se separa en láminas finas y paralelas. <strong>Esquisto.</strong> Presenta una foliación ondulada o irregular y suele brillar por sus micas. <strong>Gneis o neis.</strong> Muestra bandas claras y oscuras y puede tener cristales grandes de feldespato. <strong>Cuarcita.</strong> Procede de una arenisca rica en cuarzo y es muy dura. <strong>Mármol.</strong> Procede de una caliza y tiene estructura granoblástica. <strong>Corneana.</strong> Se forma por <strong>metamorfismo de contacto</strong>, cuando el magma calienta la roca que lo rodea. <strong>Brecha de falla y milonita.</strong> Pueden formarse por <strong>metamorfismo dinámico</strong>, cuando la roca se deforma o se tritura en una falla."]
 ],

 ejemplo:"Si se observa una franja de roca transformada alrededor de un <strong>plutón</strong>, la pista decisiva es su cercanía al foco de calor: <strong>metamorfismo</strong> de contacto."
},
{
 id:"ciclo", titulo:"Silicatos y ciclo", paginas:"300–301",

 bloques:[

 ["7. Los minerales de las rocas magmáticas y metamórficas · olivino y granates","El <strong>olivino</strong> es un silicato de magnesio y hierro. Es característico de la peridotita, una roca del manto, y también aparece en algunos basaltos. Los <strong>granates</strong> forman un grupo de silicatos de composición variable. Pueden originarse en condiciones metamórficas de media y alta presión."],
 ["Del sedimento a la roca","Las rocas expuestas pueden originar <strong>sedimentos</strong> mediante meteorización, erosión, transporte y depósito. La <strong>diagénesis</strong> transforma esos sedimentos en rocas sedimentarias."],

{

 ["9.1. Los pliegues · elementos geométricos","La <strong>charnela</strong> es la zona de mayor curvatura y los <strong>flancos</strong> quedan a ambos lados. El <strong>plano axial</strong> pasa por las charnelas de las capas. El <strong>núcleo</strong> es la zona más interna. El <strong>buzamiento</strong> es el ángulo del estrato con la horizontal. La <strong>vergencia</strong> es el ángulo menor entre el plano axial y la vertical."],

 ["magma","¿Por qué aparecen burbujas cuando asciende el magma?",2,["Aumenta la presión","Se forman cristales de inmediato","Disminuye la presión"],["Al ascender disminuye la presión y se facilita la salida de gases disueltos.","Las burbujas contienen gas. La cristalización es un proceso distinto.","Con menos presión parte de los gases deja de estar disuelta y se expande."]],
 ["igneas","Muestra negra, brillante, sin cristales y con fractura curva.",0,["Obsidiana","Gabro","Pumita"],["La fractura concoidea y el aspecto de vidrio compacto identifican la obsidiana.","El gabro es plutónico y presenta cristales.","La pumita se reconoce por su aspecto espumoso y sus numerosos huecos."]],
 ["igneas","¿Qué textura describirías si ves cristales grandes en una matriz muy fina?",2,["Vítrea","Vacuolar","Porfídica"],["Una roca enteramente vítrea carece de cristales; el ejemplo sí presenta cristales grandes.","En la textura vacuolar el rasgo clave serían las cavidades de gas.","La combinación de cristales grandes y matriz fina caracteriza la textura porfídica."]],
 ["igneas","Se ven cristales de cuarzo, feldespato y mica a simple vista. Encajan como las piezas de un puzle.",1,["Andesita","Granito","Basalto"],["La andesita es volcánica y puede presentar una matriz fina.","La composición y los cristales visibles apuntan a granito plutónico.","El basalto es una roca volcánica oscura, normalmente de grano fino."]],
 ["igneas","Cristales muy grandes de feldespato y mica, en un filón.",0,["Pegmatita","Sienita","Cuarcita"],["El emplazamiento filoniano y los cristales grandes encajan con la pegmatita.","La sienita de la tabla es plutónica y rica en ortosa, pero la pista del filón favorece pegmatita.","La cuarcita se forma por metamorfismo de rocas ricas en cuarzo."]],
 ["igneas","¿Qué pista distingue la textura vacuolar?",1,["Bandas alternas de minerales","Huecos de antiguas burbujas","Superficie compacta con fractura curva"],["Las bandas son una pista típica del gneis.","Los huecos conservan el molde de burbujas de gas.","La fractura curva y el aspecto compacto son pistas de la obsidiana."]],
 ["meta","La roca encajante se transforma en una aureola junto a una intrusión.",2,["Dinámico","Regional","De contacto"],["El dinámico se concentra en zonas de falla.","El regional actúa en áreas extensas, por ejemplo durante la formación de montañas.","La intrusión aporta calor a la roca inmediata y genera una aureola de contacto."]],
 ["meta","¿Qué proceso explica la aparición de cristales nuevos o de mayor tamaño durante el metamorfismo?",0,["Blastesis","Diagénesis","Anatexia"],["Blastesis es el crecimiento de cristales en el metamorfismo.","La diagénesis transforma sedimentos en rocas sedimentarias.","La anatexia implica fusión parcial."]],
 ["meta","Roca con bandas mineralógicas claras y oscuras.",1,["Pizarra","Gneis","Mármol"],["La pizarra se separa típicamente en láminas finas, sin el bandeado grueso descrito.","El bandeado mineralógico es característico del gneis.","El mármol suele presentar un mosaico de granos de calcita."]],

 ["meta","En una zona de falla hay roca intensamente deformada y de grano reducido.",0,["Milonita","Corneana","Pumita"],["La deformación concentrada en la zona de falla es la pista de la milonita.","La corneana se asocia al calentamiento por contacto.","La pumita es volcánica y sus huecos proceden de burbujas."]],
 ["meta","Una caliza se transforma en un mosaico de granos de calcita.",1,["Cuarcita","Mármol","Esquisto"],["La cuarcita suele proceder de arenisca rica en cuarzo.","La recristalización de calcita en una caliza produce mármol.","El esquisto suele mostrar foliación marcada por minerales como las micas."]],

 ["meteorizacion","Partículas lanzadas por el viento desgastan la base de una roca.",2,["Descompresión","Hidrólisis","Abrasión"],["La descompresión ocurre por pérdida de presión al acercarse a la superficie.","La hidrólisis altera minerales por reacción química.","El roce de partículas que viajan con el viento es abrasión."]],
 ["meteorizacion","Una roca expuesta al sol se fractura por dilataciones desiguales al calentarse y enfriarse.",1,["Gelifracción","Termoclastia","Meteorización biológica"],["Para que haya gelifracción debe formarse hielo en las grietas.","Los cambios térmicos provocan dilataciones y contracciones desiguales.","La pista indica un mecanismo térmico, sin intervención de seres vivos."]],
 ["meteorizacion","¿Qué mecanismo rompe la estructura cristalina de un mineral por la acción de los iones hidrógeno e hidroxilo del agua?",0,["Hidrólisis","Abrasión","Descompresión"],[meteorizacionQuimica.hidrolisis,"La abrasión desgasta sin producir por sí sola nuevos minerales.","La descompresión causa expansión y fractura, no este cambio mineralógico."]],
 ["meteorizacion","El agua con CO₂ facilita la disolución de la calcita. ¿Qué mecanismo actúa?",2,["Oxidación","Termoclastia","Carbonatación"],[meteorizacionQuimica.oxidacion,"La termoclastia fragmenta por diferencias térmicas.",meteorizacionQuimica.carbonatacion]],
 ["meteorizacion","Se desprenden láminas de una roca que se expande al perder la carga de encima.",1,["Abrasión","Descompresión","Oxidación"],["La abrasión requiere roce con partículas.","La pérdida de presión permite que la roca se expanda y fracture.",meteorizacionQuimica.oxidacion]],
 ["meteorizacion","Una sal soluble se separa en iones al entrar en contacto con agua.",0,["Disolución","Carbonatación","Abrasión"],[meteorizacionQuimica.disolucion,"La carbonatación se relaciona con el CO₂ y afecta, por ejemplo, a la calcita.","La abrasión desgasta por roce sin disolver iones."]],
 ["meteorizacion","¿Qué ejemplo muestra un mecanismo físico de meteorización biológica?",2,["CO₂ de la respiración disuelto en agua","Oxígeno que reacciona con minerales","Raíces que abren grietas"],["El CO₂ disuelto favorece reacciones químicas.","La reacción con oxígeno es oxidación, un mecanismo químico.","La raíz actúa como una cuña y ensancha la grieta, de forma parecida a la gelifracción."]],
 ["suelo","¿Dónde se acumulan los materiales arrastrados por el agua desde A?",1,["O","B","C"],["O es el mantillo superficial.","B recibe materiales procedentes del lavado.","C contiene restos y fragmentos de la roca madre."]],
 ["suelo","Un suelo tiene numerosos poros pequeños, pero el agua apenas circula. ¿Qué propiedad es baja?",2,["Porosidad","Proporción de partículas finas","Permeabilidad"],["Puede haber abundante volumen de huecos y aun así circular poco el agua.","Los poros pequeños son compatibles con partículas finas abundantes.","La permeabilidad mide la facilidad con la que pasa el agua."]],
 ["suelo","Aparece una costra de cal en un clima árido con fuerte evaporación.",0,["Caliche","Podsol","Litosuelo"],["El ascenso capilar y la evaporación explican la acumulación superficial de cal o sales.","El podsol se asocia con clima húmedo y lavado descendente.","Un litosuelo se reconoce por poco espesor sobre roca madre poco alterada."]],
 ["suelo","¿Qué condición dificulta mantener el material sobre el que se forma el suelo?",1,["Aporte de humus","Pendiente muy pronunciada","Tiempo suficiente"],["El humus y la actividad biológica favorecen el desarrollo del suelo.","Una pendiente muy fuerte facilita la retirada de detritos.","Con tiempo pueden desarrollarse horizontes."]],
 ["suelo","¿Qué describe la textura de un suelo?",2,["El volumen de huecos","La facilidad de paso del agua","Las proporciones de arena, limo y arcilla"],["El volumen relativo de huecos es la porosidad.","El paso del agua es la permeabilidad.","La textura se refiere a las proporciones de partículas según su tamaño."]],
 ["sedimentos","Las partículas avanzan dando pequeños saltos y volviendo repetidamente al fondo.",1,["Suspensión","Saltación","Rodadura"],["Las partículas en suspensión permanecen dentro del fluido durante el transporte.","El avance por saltos sucesivos describe la saltación.","En la rodadura las partículas giran en contacto con el fondo."]],
 ["sedimentos","La muestra A (arena de playa) tiene clastos muy pequeños y redondeados. La muestra B (sedimento glaciar) tiene fragmentos angulosos de distintos tamaños. ¿Cuál tiene madurez textural alta?",0,["La muestra A","La muestra B","El tamaño y la redondez indican solo la madurez mineralógica"],["La muestra A tiene madurez textural alta porque sus clastos son muy pequeños y redondeados.","La angularidad y el tamaño grande apuntan a menor madurez textural en esta comparación.","En este caso se compara el tamaño y la forma de los clastos. Para valorar la madurez mineralógica se examina la composición, por ejemplo la proporción de cuarzo o de minerales de arcilla formados durante la alteración."]],
 ["sedimentos","La corriente pierde energía y los clastos caen al fondo.",2,["Acreción cinética","Meteorización","Depósito gravitacional"],["En la acreción cinética las partículas en movimiento se acumulan al tropezar con un obstáculo.","La meteorización altera roca expuesta.","La pérdida de energía de la corriente permite que los clastos se depositen por gravedad."]],
 ["sedimentos","La arena en movimiento se acumula al topar con un obstáculo.",1,["Disolución","Acreción cinética","Diagénesis"],["En la disolución viajan iones, sin acumulación de granos contra un obstáculo.","El obstáculo es la pista que identifica este modo de sedimentación.","La diagénesis transforma posteriormente el sedimento acumulado en roca."]],
 ["sedimentarias","Una roca detrítica presenta clastos de 8 mm con bordes angulosos.",2,["Pudinga","Arenisca","Conglomerado tipo brecha"],["La pudinga presenta clastos gruesos redondeados.","La arenisca se compone de clastos menores de 2 mm en la tabla del libro.","Los clastos mayores de 2 mm y angulosos identifican una brecha."]],
 ["sedimentarias","¿Qué nombre recibe el proceso por el que los minerales precipitan entre clastos y los unen?",0,["Cementación","Compactación","Saltación"],["El cemento mineral rellena huecos y une los clastos.","La compactación reduce huecos al aumentar la carga.","La saltación es un modo de transporte."]],
 ["sedimentarias","Una roca mezcla carbonato de calcio con una fracción importante de limo o arcilla.",1,["Halita","Marga","Pudinga"],["La halita es cloruro de sodio, no una mezcla de carbonato y arcilla.","La mezcla de carbonato cálcico y partículas detríticas finas define la marga.","La pudinga está formada por clastos gruesos redondeados."]],
 ["sedimentarias","¿Cuál es el mineral más característico de una caliza?",2,["Halita","Cuarzo","Calcita"],["La halita es cloruro de sodio y puede formar cristales cuando se evapora el agua.","El cuarzo es un silicato habitual en arenas y areniscas.","La calcita es carbonato de calcio, componente principal de muchas calizas."]],
 ["sedimentarias","¿Qué proceso permite explicar una roca de yeso en una cuenca salina?",1,["Transporte de cantos grandes","Formación de cristales al evaporarse el agua","Compactación de restos vegetales"],["Los cantos gruesos pueden dar conglomerados.","Al evaporarse el agua, las sales disueltas quedan y forman cristales, como los de yeso.","Los restos vegetales enterrados son precursores de carbones."]]

<script>
"use strict";

const respuestas = [
 [14,"sedimentos","Una arena de playa y un sedimento glaciar","La arena de playa está formada por clastos muy pequeños y redondeados. Un depósito glaciar presenta fragmentos de tamaños distintos con bordes angulosos. Compara su madurez textural y explica por qué importa el agente que los transportó.","La arena de playa presenta madurez textural alta por sus clastos muy pequeños y redondeados. El sedimento glaciar del ejemplo tiene menor madurez textural por sus fragmentos angulosos y de distintos tamaños. El agua y el oleaje pueden hacer que los granos choquen y se desgasten. Un glaciar puede transportar juntos fragmentos grandes y pequeños sin redondearlos de la misma manera.","Compara tamaño y forma y justifica qué aporta conocer el agente. Actividad inspirada en el repaso de la p. 283."],
 [14,"meteorizacion","Un muro de arenisca pierde granos","Una arenisca contiene granos de cuarzo unidos por cemento calcáreo. La lluvia con CO₂ va disolviendo parte del cemento. ¿Qué alteración ocurre primero? ¿Por qué acaban desprendiéndose los granos?","El agua con CO₂ favorece la disolución del carbonato del cemento mediante carbonatación. Cuando el cemento pierde continuidad, deja de unir parte de los clastos y estos se desprenden.","Distingue la reacción química en el cemento del desprendimiento posterior de granos. Actividad inspirada en la p. 285."],
 [15,"meta","¿Ha cambiado la textura o la estructura?","En una muestra metamorfizada los cristales de feldespato se han agrandado. En otra, las micas aparecen claramente orientadas en planos. ¿Qué cambio describe cada caso?","El crecimiento de cristales es un cambio de textura y puede deberse a blastesis. La orientación planar de los minerales es un cambio de estructura; en este caso es foliación.","Distingue crecimiento de tamaño y orientación preferente. Actividad inspirada en el repaso de la p. 305."],
 [15,"esfuerzos","Identifica un pliegue y una falla","En un corte ves capas plegadas que han quedado desplazadas a ambos lados de una fractura recta. Identifica las dos estructuras y justifica qué rasgo visible te permite distinguirlas.","Las capas curvadas forman un pliegue. La fractura que corta y desplaza las capas es una falla.","Indica la curvatura del pliegue y el desplazamiento a ambos lados de la falla. Actividad inspirada en la p. 307."],

 [14,"meteorizacion","Distingue tres mecanismos","Una roca se rompe al congelarse el agua de sus grietas. Otra se desgasta por la arena que arrastra el viento. En una tercera los iones hidrógeno e hidroxilo del agua rompen la estructura cristalina de un mineral. Nombra el mecanismo de cada caso y justifícalo.","Gelifracción, porque el hielo aumenta de volumen y actúa como cuña. Abrasión, por el roce de los clastos arrastrados. Hidrólisis, porque los iones hidrógeno e hidroxilo del agua rompen la estructura cristalina del mineral.","Nombra cada mecanismo, clasifica los dos primeros como mecánicos y el último como químico, y explica la pista."],
 [14,"suelo","Compara caliche y litosuelo","Un perfil tiene una costra de cal en una región seca. Otro apenas tiene suelo por encima de la roca madre. Identifica los dos suelos y explica cómo los distingues.","El primero es caliche: el ascenso capilar y la evaporación favorecen la acumulación de cal o sales. El segundo es un litosuelo o suelo rocoso: es poco evolucionado, de poco espesor y con horizontes poco diferenciados.","Relaciona aridez y evaporación con el caliche, y poco espesor y falta de horizontes diferenciados con el litosuelo."],
 [14,"suelo","Explica la fertilidad","Un suelo arcilloso húmedo tiene muchos huecos diminutos y el agua circula despacio. Explica si puede tener mucha porosidad y poca permeabilidad. Añade dos factores que influyan en la fertilidad.","Puede tener porosidad alta si los huecos ocupan mucho volumen, pero permeabilidad baja si el agua circula mal entre poros pequeños. El humus y la disponibilidad de nutrientes favorecen la fertilidad; también cuentan la aireación y la humedad.","Define ambas propiedades y añade dos factores de fertilidad con sentido."],
 [14,"sedimentos","Distingue detrito, sedimento y depósito","En una ladera se acumulan fragmentos de roca formados por meteorización. La lluvia arrastra parte de ellos hasta un río. Más abajo, la corriente pierde energía. Identifica el detrito, indica cuándo pasa a llamarse sedimento e identifica el modo de depósito.","Los clastos que permanecen acumulados donde se formaron constituyen el detrito. El agua erosiona la ladera al recoger los clastos y ponerlos en movimiento. Desde ese instante el material movilizado se llama sedimento. Más abajo, cuando la corriente pierde energía, los clastos caen al fondo por depósito gravitacional.","Distingue el detrito del sedimento y explica por qué se produce el depósito gravitacional."],
 [14,"sedimentarias","Identifica dos rocas sedimentarias","Una roca tiene cantos redondeados de 7 mm. Otra tiene granos cementados de cuarzo de 0,5 mm. Clasifica cada una y explica la pista del tamaño.","La primera es una pudinga, conglomerado de clastos redondeados mayores de 2 mm. La segunda es una arenisca: los clastos de 0,5 mm entran en el intervalo de tamaño de arena.","Incluye los dos nombres y justifica cada tamaño. En la primera cuenta también la redondez."],
 [15,"magma","Explica una erupción","Explica en tres o cuatro frases qué ocurre con la presión y los gases cuando asciende el magma. Nombra un producto gaseoso, uno líquido y uno sólido.","Al ascender disminuye la presión. Parte del gas disuelto forma burbujas y se expande. Esto puede favorecer la apertura de fracturas y la salida del magma. Ejemplos: vapor de agua, lava y lapilli.","Conecta el descenso de presión con la formación y expansión de burbujas. Distingue gas, lava y fragmento sólido."],
 [15,"igneas","Identifica y compara dos rocas","Una muestra presenta un mosaico visible de cuarzo, feldespatos y micas. Otra es negra, compacta, sin cristales visibles y rompe en superficies curvas. Identifica ambas y relaciona su textura con el enfriamiento.","La primera es granito de textura fanerítica, típico de enfriamiento lento en profundidad. La segunda es obsidiana: la fractura curva y el aspecto vítreo indican un vidrio volcánico de enfriamiento muy rápido.","Da el nombre de cada roca, una pista de textura y la relación con el tiempo disponible para cristalizar."],
 [15,"meta","Describe la serie regional","Escribe el orden completo desde la arcilla y explica qué cambia al alcanzar la anatexia. Usa al menos una pista para reconocer una roca de la serie.","Arcilla → pizarra → filita → esquisto → gneis → granito de anatexia. Con mayor grado, pueden aparecer micas visibles en el esquisto y bandas claras y oscuras en el gneis. La anatexia es fusión parcial y el granito es ígneo porque cristaliza del fundido.","Comprueba las seis posiciones, el aumento de grado y la distinción entre el tramo sólido y la cristalización final."],
 [15,"meta","Compara corneana y milonita","Una roca se encuentra en una aureola junto a una intrusión. Otra se ha deformado intensamente en una gran falla. Propón la roca y el tipo de metamorfismo de cada caso.","En la aureola, la corneana es característica del metamorfismo térmico o de contacto. En la falla, la milonita se asocia al metamorfismo dinámico por deformación intensa.","Nombra ambas rocas y enlaza cada una con el factor y el lugar indicados."],
 [15,"ciclo","Reconstruye un camino del ciclo","Imagina que el cuarzo de un granito se incorpora primero a una arenisca y acaba en una cuarcita. Explica qué procesos conectan las tres rocas.","La meteorización y la erosión liberan y movilizan partículas; estas se transportan y depositan. La diagénesis transforma el sedimento en arenisca. El metamorfismo recristaliza la arenisca rica en cuarzo y origina cuarcita.","Incluye producción y depósito de sedimentos, diagénesis y metamorfismo en estado sólido."],
 [15,"esfuerzos","Distingue un pliegue y una falla","En A las capas se curvan. En B, una capa queda desplazada a distinta altura a ambos lados de una fractura. Identifica ambas estructuras y explica la pista.","A es un pliegue porque las capas se curvan. B es una falla porque la capa está rota y desplazada.","Usa la curvatura para reconocer el pliegue y el desplazamiento para reconocer la falla."],
 [15,"esfuerzos","Explica los elementos de pliegue y falla","Define charnela, flancos y plano axial. Después define plano de falla, labios y salto.","La charnela es la zona de mayor curvatura y los flancos quedan a ambos lados. El plano axial conecta las charnelas de las capas. El plano de falla es la superficie de rotura, los labios son los bloques y el salto expresa su desplazamiento relativo.","Incluye los seis elementos y usa desplazamiento solo al hablar de la falla."]

function clearActiveSpeaker() {
  if (!activeSpeaker) return;

  activeSpeaker.querySelector("span").textContent = "🔊";

}
const readingPause = 450;
const defaultVoiceLabel = "Automática (Google o voz del dispositivo)";
const spanishVoices = () => (synth?.getVoices() || []).filter(voice => /^es(?:[-_]|$)/i.test(voice.lang));
const isGoogle = voice => /\bgoogle\b/i.test(voice.name + " " + voice.voiceURI);
const isSpain = voice => /^es[-_]es$/i.test(voice.lang);
function deviceVoice(voices) {
  const available = voices.filter(voice => !isGoogle(voice));
  return available.find(voice => isSpain(voice) && /\bm[oó]nica\b/iu.test(voice.name))
    || available.find(isSpain)
    || available.find(voice => voice.default)
    || available[0];
}
const endsSentence = part => /[.!?][»”"')\]]*$/u.test(part)
  && !/\b(?:p|pp|pág|págs|fig|núm|aprox|etc)\.$/iu.test(part);

function speechSentences(text) {
  const sentences = [];
  const boundary = /([.!?][»”"')\]]*)\s+(?=[\p{Lu}¿¡0-9«“"])/gu;
  let start = 0;
  for (const match of text.matchAll(boundary)) {
    const end = match.index + match[1].length;
    const part = text.slice(start,end).trim();
    if (endsSentence(part)) {
      sentences.push(part);
      start = match.index + match[0].length;
    }
  }
  const tail = text.slice(start).trim();
  if (tail) sentences.push(tail);
  return sentences;
}

  speechRun++;

  synth?.cancel();

}

}
function speak(area,trigger) {
  if (activeSpeaker === trigger) {

  stopSpeech();

    || google.find(isSpain) || google[0] || deviceVoice(voices);

  trigger.querySelector("span").textContent = "■";
  const lines = area.querySelectorAll("h1,h2,h3,p,figcaption,legend,.choice,li,.feedback");

    .flatMap(node => {
      const text = node.querySelector(".sort-row span")?.innerText || node.innerText;
      return text.split(/\r\n?|\n/).flatMap(speechSentences);
    });
  let index = 0;
  function next() {
    if (currentRun !== speechRun) return;
    if (index === chunks.length) { clearActiveSpeaker(); $("speech-status").textContent = "Lectura terminada."; return; }
    const chunk = chunks[index++];
    utterance = new SpeechSynthesisUtterance(chunk);
    utterance.lang = voice ? voice.lang.replace(/_/g,"-") : "es-ES";
    if (voice) utterance.voice = voice;
    utterance.rate = Number(state.rate);
    utterance.onend = () => {
      if (currentRun !== speechRun) return;
      if (index < chunks.length) speechTimer = setTimeout(next,readingPause);

    };

      if (currentRun !== speechRun) return;
      if (voice && isGoogle(voice) && ["network","voice-unavailable","language-unavailable","synthesis-failed"].includes(event.error)) {

      $("speech-status").textContent = "No se pudo iniciar la lectura. Puedes elegir otra voz en Accesibilidad y lectura.";
    };
    synth.speak(utterance);
  }
  $("speech-status").textContent = "Leyendo…";
  next();
}

  <details><summary>Ver solución razonada</summary>${flow(serie)}<p>Al aumentar el grado metamórfico se pasa de pizarra a filita, esquisto y gneis. La anatexia implica fusión parcial. El granito se forma al cristalizar ese fundido.</p></details></section>`;
  sortList();
  $("sort-list").onclick = event => {
    const move = event.target.closest("button[data-from]");
    if (!move) return;
    const start = Number(move.dataset.from);
    const end = start + Number(move.dataset.step);
    [ordering[start],ordering[end]] = [ordering[end],ordering[start]];
    sortList();
    const same = $("sort-list").querySelector(`[data-from="${end}"][data-step="${move.dataset.step}"]`);
    const reverse = $("sort-list").querySelector(`[data-from="${end}"]:not([data-step="${move.dataset.step}"])`);
    (same.disabled ? reverse : same).focus();
    $("sort-feedback").textContent = "";
    $("sort-change").textContent = `${serie[ordering[end]]} está ahora en la posición ${end+1}.`;
  };
  $("check-sort").onclick = () => {
    const first = ordering.findIndex((item,index) => item !== index);
    if (first < 0) {
      state.sorted = true;
      save();
    }
    const feedback = $("sort-feedback");
    feedback.className = "feedback";
    feedback.textContent = first < 0
      ? "Serie correcta. El granito es ígneo porque cristaliza a partir del fundido de anatexia."
      : `Revisa la posición ${first+1}. ${["Empieza por el material de partida, antes del metamorfismo.","Busca la roca con planos finos que aparece al grado más bajo.","Entre pizarra y esquisto aparece una roca de brillo sedoso.","Busca la roca con foliación marcada y micas visibles.","Antes de la fusión aparece la roca de bandas claras y oscuras.","La última posición corresponde al producto que cristaliza del fundido."][first]}`;
  };
  $("shuffle").onclick = () => {
    const newOrder = shuffled(ordering);
    if (newOrder.every((item,index) => item === index) || newOrder.every((item,index) => item === ordering[index])) {
      newOrder.push(newOrder.shift());
    }
    ordering = newOrder;
    sortList();
    $("sort-feedback").textContent = "";
    $("sort-change").textContent = "Serie mezclada.";
  };
}

function begin(ids) {
  quiz = {ids:shuffled(ids), at:0, score:0, choice:null};
  showQuestion(true);
}
function showQuestion(focus) {
  const target = $("question");
  if (quiz.at === quiz.ids.length) {
    target.innerHTML = `<section class="block"><h2 tabindex="-1">Resultado</h2><p>${quiz.score} de ${quiz.ids.length} respuestas correctas en esta práctica.</p><p>${reviewIds().length} preguntas pendientes en el repaso de fallos.</p>${button("repaso","Ver progreso")}</section>`;
    if (focus) target.querySelector("h2").focus();
    return;
  }
  const id = quiz.ids[quiz.at];
  const [topic,prompt,correct,options,reasons] = banco[id];
  const answered = quiz.choice !== null;
  target.innerHTML = `<section class="block"><h2 tabindex="-1">Pregunta ${quiz.at+1} de ${quiz.ids.length}</h2>
  <form id="answer"><fieldset ${answered?"disabled":""}><legend>${prompt}</legend>
  ${options.map((option,i)=>`<label class="choice"><input type="radio" name="choice" value="${i}" required ${quiz.choice===i?"checked":""}> ${option}</label>`).join("")}
  </fieldset>${answered?"":'<button class="primary">Comprobar respuesta</button>'}</form>
  ${answered ? `<div class="feedback" tabindex="-1" id="answer-feedback"><h3>${quiz.choice===correct?"Correcto":"Revisa esta pista"}</h3>
  ${modelExplanation(reasons[quiz.choice])}${quiz.choice!==correct?`<p><strong>Respuesta correcta: ${options[correct]}.</strong></p>${modelExplanation(reasons[correct])}`:""}
  <a href="#${topic}">Volver a la explicación</a></div>
  <button class="primary" id="next-question">${quiz.at+1===quiz.ids.length?"Ver resultado":"Siguiente pregunta"}</button>`:""}</section>`;
  $("answer").onsubmit = event => {
    event.preventDefault();
    if (quiz.choice !== null) return;
    const value = new FormData(event.target).get("choice");
    if (value === null) return;
    quiz.choice = Number(value);
    const right = quiz.choice === correct;
    if (right) quiz.score++;
    state.answers[id] = right;
    save();
    $("mistakes").textContent = `Repetir fallos (${reviewIds().length})`;
    $("mistakes").disabled = reviewIds().length === 0;
    showQuestion(false);
    $("answer-feedback").focus();
  };
  if (answered) $("next-question").onclick = () => {quiz.at++; quiz.choice=null; showQuestion(true);};
  if (focus) target.querySelector("h2").focus();
}

      return [...(studyQuestions[id] || []), ...Object.values(extraQuestions[id] || {}), ...special].map(([question,answer,destacada]) => ({

      }));

    ...respuestas.map(([topic,,title,question,answer])=>({topic,title,question,answer})),
    ...identificaciones.map(item=>({
      topic:item.tema, title:item.titulo, question:item.descripcion, image:challengeIllustration(item),
      answer:item.partes.map(([label,correct,why])=>`<strong>${label} · ${correct}.</strong> ${why}`)
    })),
    ...preguntasSimulacro.map(({tema,pregunta,modelo,foto,corte})=>({
      topic:tema,title:"Pregunta de práctica",question:pregunta,answer:modelo,
      image:corte ? mockCut(corte) : foto ? challengeIllustration(identificaciones.find(item=>item.id==="perfil-foto")) : ""
    }))
  ];
  const panel = $("solved-exam");

  const onlyPossible = $("solved-only-possible");
  let index = 0;
  const studyTopic = $("study-topic");

  const firstInternal = cards.findIndex(card=>card.title.startsWith("Tema 15"));
  const sections = [
    ["Meteorización", "Meteorización ·"],

    ["Magma y sus componentes", "Tema 15 · El magma"],
    ["Plutón y dique", "Tema 15 · Plutón"],
    ["Erupciones y productos volcánicos", "Tema 15 · Erupciones"],
    ["Partes del volcán", "Tema 15 · Partes"],
    ["Factores de la actividad volcánica", "Tema 15 · Factores"],
    ["Enfriamiento del magma", "Tema 15 · Enfriamiento"],
    ["Textura y estructura", "Tema 15 · Textura"],
    ["Rocas magmáticas", "Tema 15 · Reconocimiento"],
    ["Metamorfismo y sus factores", "Tema 15 · Metamorfismo y"],

    ["Ciclo de las rocas", "Tema 15 · Ciclo"],
    ["Pliegues y fallas", "Pliegues y fallas"]
  ];
  const visibleCards = () => finalStudy
    ? cards.filter((_,i)=>!studyTopic.value || (studyTopic.value === "14" ? i < firstInternal : i >= firstInternal))
    : cards.filter(card=>(!topic.value || card.topic === Number(topic.value)) && (!onlyPossible.checked || card.destacada));
  let currentSections = [];
  function refreshStudyIndex() {
    const visible = visibleCards();
    currentSections = sections.flatMap(([label,prefix])=>{
      const position = visible.findIndex(card=>card.title.startsWith(prefix));
      return position < 0 ? [] : [{label,position}];
    });
    studySection.replaceChildren(...currentSections.map(({label,position})=>new Option(label,String(position))));
  }
  function show(focus=false) {
    const visible = visibleCards();
    if (finalStudy) studySection.value = String(currentSections.filter(section=>section.position <= index).at(-1).position);
    const {title,question,image,answer,resource,imageInAnswerOnly} = visible[index];
    panel.innerHTML = `<section class="block">
      <p class="muted">Pregunta ${index+1} de ${visible.length}</p>
      <h2 tabindex="-1">${title}</h2>
      <p><strong>${question}</strong></p>${imageInAnswerOnly ? "" : image || ""}${resource || ""}
      ${finalStudy ? `<details><summary>Ver respuesta modelo</summary>${modelExplanation(answer)}${image || ""}</details>` : `<h3>Respuesta modelo</h3>${modelExplanation(answer)}`}

        <button type="button" id="solved-prev" ${index===0?"disabled":""}>Anterior</button>
        <button type="button" id="solved-next" class="primary" ${index===visible.length-1?"disabled":""}>Siguiente</button>
      </div></section>`;

    $("solved-next").onclick = () => { index++; show(true); };
    if (focus) panel.querySelector("h2").focus();
  }
  if (finalStudy) {
    refreshStudyIndex();
    studyTopic.onchange = () => { index = 0; refreshStudyIndex(); show(); };
    studySection.onchange = () => { index = Number(studySection.value); show(true); };
  }
  else topic.onchange = onlyPossible.onchange = () => { index = 0; show(); };
  show();
}

function markChallenge(id,completed) {
  if (completed && !state.done.includes(id)) state.done.push(id);
  if (!completed) state.done = state.done.filter(item=>item!==id);
  save();
}
function renderChallengeList(id,guided) {
  const labels = element => element.partes.map(([label],i)=>`<div class="match-row"><label for="${element.id}-${i}">${element.capas || element.perfiles ? label.split(" · ")[0] : label}</label><select id="${element.id}-${i}" required>

  const selected = identificaciones.find(item=>item.id===id);
  const index = selected ? -1 : Number(id.slice("written-".length));
  if (guided) {
    renderGuidedChallenge(selected,index,challengeIllustration);
    return;
  }
  $("challenges").innerHTML = `
  ${identificaciones.filter(item=>item.id===id).map(item=>`<section class="block"><h3>${item.titulo}</h3><p>${item.descripcion}</p>${challengeIllustration(item)}<form data-match="${item.id}">${labels(item)}
  <button class="primary">Comprobar correspondencias</button></form><div id="feedback-${item.id}" aria-live="polite"></div></section>`).join("")}
  ${selected?"":'<h2 class="section-title">Escribe y justifica</h2>'}
  ${respuestas.map(([number,lesson,title,prompt,answer,check],i)=> i===index ? `<section class="block written">
  <div class="block-head"><h3>Tema ${number} · ${title}</h3>${speaker("Escuchar la actividad "+title,"data-read")}</div>
  <p id="prompt-${i}">${prompt}</p><label for="written-${i}">Tu respuesta</label>
  <textarea id="written-${i}" data-draft="${i}" aria-describedby="prompt-${i}" rows="3"></textarea>

  <div id="exam-written-review" hidden><h3>Respuesta modelo y criterios</h3>${modelExplanation(answer)}<p><strong>Comprueba:</strong> ${check}</p>
  <label><input type="checkbox" data-complete="written-${i}" ${state.done.includes("written-"+i)?"checked":""}> He comparado mi respuesta</label></div>
  <p><a href="#${lesson}">Consultar la explicación</a></p></section>` : "").join("")}`;
  for (const textarea of $("challenges").querySelectorAll("[data-draft]")) {
    textarea.value = drafts.get(textarea.dataset.draft) || "";
    textarea.oninput = () => drafts.set(textarea.dataset.draft,textarea.value);
    $("exam-written-check").onclick = () => {
      if (!textarea.value.trim()) {
        textarea.setCustomValidity("Escribe tu respuesta antes de ver la corrección.");
        textarea.reportValidity();
        textarea.focus();
        textarea.setCustomValidity("");
        return;
      }
      $("exam-written-review").hidden = false;
      $("exam-written-review").setAttribute("tabindex","-1");
      $("exam-written-review").focus();
    };
  }
  for (const check of $("challenges").querySelectorAll("[data-complete]")) {
    check.onchange = () => markChallenge(check.dataset.complete,check.checked);
  }
  for (const form of $("challenges").querySelectorAll("[data-match]")) {
    form.onsubmit = event => {
      event.preventDefault();
      const item = identificaciones.find(challenge=>challenge.id===form.dataset.match);
      const rows = item.partes.map(([label,correct,why],i)=> {
        const choice = $(item.id+"-"+i).value;
        return {label,correct,why,right: choice===correct};
      });
      const feedback = $("feedback-"+item.id);
      feedback.className = "feedback";
      const score = rows.filter(row=>row.right).length;
      feedback.innerHTML = `<h3>${score} de ${rows.length} correctas</h3><ul>${rows.map(row=>`<li><strong>${row.right?"Correcto":"Revisa"} · ${row.label}.</strong> ${row.correct}. ${row.why}</li>`).join("")}</ul>`;
      if (item.final) {
        const note = document.createElement("p");
        note.textContent = item.final;
        feedback.append(note);
      }
      if (score===rows.length) markChallenge(item.id,true);
    };
  }
}

function renderGuidedChallenge(item,index,illustration) {
  const area = $("challenges");
  const written = item ? null : respuestas[index];
  const title = item?.titulo || written[2];
  const [caseText,solution] = ejemplosGuiados[item ? temasIdentificacion[item.id] : written[1]];
  const steps = item?.partes || consignasEscritas[index];
  const activityId = item?.id || "written-"+index;
  let step = 0;
  let allCorrect = true;

  function showExample(focus=false) {
    area.innerHTML = `<section class="block"><h2 tabindex="-1">${title}</h2>
    <div class="notice"><h3>Ejemplo resuelto</h3><p>${caseText}</p><p><strong>Respuesta y pista.</strong> ${solution}</p></div>
    <button class="primary" id="guided-start">Empezar actividad</button></section>`;
    $("guided-start").onclick = () => showStep();
    if (focus) area.querySelector("h2").focus();
  }

  function showStep() {
    stopSpeech();
    const current = steps[step];
    const prompt = item ? current[0] : current;
    const label = item?.capas || item?.perfiles ? "Identifica " + prompt.split(" · ")[0] + "." : prompt;
    area.innerHTML = `<section class="block">
      <div class="block-head"><h2 tabindex="-1">${title}</h2>${speaker("Escuchar el paso","data-read")}</div>
      <p><strong>Paso ${step+1} de ${steps.length}</strong></p>
      ${item ? illustration(item) : `<p>${contextosEscritos[index]}</p>`}
      ${item?.capas || item?.perfiles ? `<details><summary>Ver una pista</summary><p>${prompt.split(" · ")[1]}</p></details>` : ""}
      <form id="guided-form"><p id="guided-prompt"><strong>${label}</strong></p>
      ${item ? `<label for="guided-answer">Elige una respuesta</label>
        <select id="guided-answer" aria-describedby="guided-prompt" required><option value="">Selecciona una opción</option>${item.opciones.map(option=>`<option>${option}</option>`).join("")}</select>`
        : '<label for="guided-answer">Escribe tu respuesta</label><textarea id="guided-answer" rows="3" aria-describedby="guided-prompt" required></textarea>'}
      <div class="actions"><button class="primary">${item?"Comprobar respuesta":"Guardar y continuar"}</button></div></form>
      <div id="guided-feedback" tabindex="-1"></div>
    </section>`;
    if (!item) {
      const key = activityId+"-step-"+step;
      $("guided-answer").value = drafts.get(key) || "";
      $("guided-answer").oninput = event => drafts.set(key,event.target.value);
    }
    $("guided-form").onsubmit = event => {
      event.preventDefault();
      const field = $("guided-answer");
      if (!field.value.trim()) { field.focus(); return; }
      if (!item) { advance(); return; }
      const right = field.value === current[1];
      allCorrect &&= right;
      field.disabled = true;
      event.submitter.disabled = true;
      $("guided-feedback").className = "feedback";
      $("guided-feedback").innerHTML = `<h3>${right?"Correcto":"Revisa esta pista"}</h3><p><strong>${current[1]}.</strong> ${current[2]}</p>
        <button class="primary" id="guided-next">${step+1===steps.length?"Ver resultado":"Siguiente paso"}</button>`;
      $("guided-feedback").focus();
      $("guided-next").onclick = advance;
    };
    area.querySelector("h2").focus();
  }

  function advance() {
    if (++step < steps.length) { showStep(); return; }
    if (item && allCorrect) markChallenge(activityId,true);
    area.innerHTML = `<section class="block"><h2 tabindex="-1">Actividad completada</h2>
      ${item ? `<p>${allCorrect?"Has acertado todos los pasos.":"Puedes repetir la actividad para repasar los pasos que fallaste."}</p>${item.final?`<p>${item.final}</p>`:""}`
      : `<h3>Tus respuestas</h3><ol id="guided-replies"></ol><h3>Respuesta modelo</h3>${modelExplanation(written[4])}<p><strong>Comprueba.</strong> ${written[5]}</p>
        <label><input type="checkbox" id="guided-reviewed" ${state.done.includes(activityId)?"checked":""}> He comparado mis respuestas</label>`}
      <div class="actions"><button id="guided-repeat">Volver al ejemplo</button><button class="primary" id="guided-choose">Elegir otra actividad</button></div></section>`;
    if (!item) {
      for (const [i,prompt] of steps.entries()) {
        const li = document.createElement("li");
        li.textContent = prompt+" "+(drafts.get(activityId+"-step-"+i) || "");
        $("guided-replies").append(li);
      }
      $("guided-reviewed").onchange = event => markChallenge(activityId,event.target.checked);
    }
    $("guided-repeat").onclick = () => { step=0; allCorrect=true; showExample(true); };
    $("guided-choose").onclick = () => $("challenge-choice").focus();
    area.querySelector("h2").focus();
  }
  showExample();
}

}

function renderSoilTraining() {
  screen.innerHTML += '<div id="soil-training"></div>';
  const area = $("soil-training");
  let current = 0;
  const corrected = new Set();
  const order = perfilesConCuatroHorizontes.map((_,index)=>index);
  const attempts = [];
  function example(focus=false) {
    area.innerHTML = `<section class="block"><h2 tabindex="-1">Ejemplo guiado</h2>
      <p>Observa la flecha de la foto del libro. Señala la franja clara que está encima de la franja ocre.</p>
      <figure class="book-figure photo-exercise"><img src="https://orientadoracarmenmora-max.github.io/bio_14_y_15_revision_v2/14-podsol.webp" alt="Un perfil de suelo. Una flecha verde señala una franja clara encima de una franja de color ocre."><figcaption>Fotografía del libro.</figcaption></figure>
      <p><strong>Respuesta.</strong> En el perfil del libro, la franja señala el <strong>horizonte A</strong>, donde predomina el <strong>lavado</strong>. En el <strong>horizonte B</strong>, situado debajo, se acumula parte del material arrastrado.</p>
      <p>En los perfiles de práctica, fíjate en la posición y en los materiales. Los colores y el grosor de las capas pueden cambiar.</p>
      <button id="soil-start" class="primary">Ver el primer perfil</button></section>`;
    $("soil-start").onclick = question;
    if (focus) area.querySelector("h2").focus();
  }
  function question() {
    const profile = perfilesConCuatroHorizontes[order[current]];
    const isLastProfile = current + 1 === order.length;
    area.innerHTML = `<section class="block"><h2 tabindex="-1">Perfil ${current+1} de ${order.length}</h2><h3>${profile.titulo}</h3>
      <p>Observa el perfil y elige un horizonte para cada una de las cuatro marcas.</p>
      ${trainingProfile(profile)}
      <form id="soil-form">${[...profile.correccion].sort(([a],[b])=>a.localeCompare(b)).map(([tag],i)=>`<div class="match-row"><label for="soil-response-${i}">Marca ${tag}</label><select id="soil-response-${i}"><option value="">Elige un horizonte</option>${["O","A","B","C"].map(h=>`<option value="${h}">Horizonte ${h}</option>`).join("")}</select></div>`).join("")}
      <div class="actions">
        <button type="button" id="soil-previous" ${current===0?"disabled":""}>Perfil anterior</button>
        <button type="submit" class="primary">Corregir perfil</button>
        <button type="button" id="soil-next">${isLastProfile?"Repetir perfiles":"Siguiente perfil"}</button>
      </div></form><div id="soil-result" hidden></div></section>`;
    const rows = [...profile.correccion].sort(([a],[b])=>a.localeCompare(b));
    const fields = rows.map((_,i)=>$("soil-response-"+i));
    fields.forEach((field,i)=>{ field.value=attempts[current]?.[i] ?? ""; });
    function saveAnswers() {
      attempts[current]=fields.map(field=>field.value);
    }
    $("soil-previous").onclick = () => {
      if (current===0) return;
      saveAnswers();
      current--;
      question();
    };
    function showCorrection(focus=false) {
      const result = $("soil-result");
      result.hidden = false;
      result.innerHTML = `<h3 tabindex="-1">Corrección del perfil ${current+1}</h3>
        <ul class="study-points">${rows.map(([tag,expected,why],i)=>{
          const answer = attempts[current][i];
          const status = answer ? (answer===expected?"Correcto":"Revisa") : "Sin responder";
          return `<li><strong>Marca ${tag} · ${status}.</strong> ${answer?`Elegiste el horizonte ${answer}. `:""}Corresponde al <strong>horizonte ${expected}</strong>. ${why}</li>`;
        }).join("")}</ul>`;
      if (focus) result.querySelector("h3").focus();
    }
    fields.forEach(field => { field.onchange = () => {
      corrected.delete(current);
      $("soil-result").hidden = true;
    }; });
    $("soil-form").onsubmit = event => {
      event.preventDefault();
      saveAnswers();
      corrected.add(current);
      showCorrection(true);
    };
    $("soil-next").onclick = () => {
      saveAnswers();
      if (isLastProfile) {
        current=0;
        attempts.length=0;
        corrected.clear();
        order.push(order.shift());
      } else {
        current++;
      }
      question();
    };
    if (corrected.has(current)) showCorrection();
    area.querySelector("h2").focus();
  }
  example();
}

   circulo(punta.x+Math.cos(angulo)*radio,punta.y+Math.sin(angulo)*radio,lado/2);
  }
 }
 function dibujar(ahora) {
  cuadro=0;
  const caja=lienzo.getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  const ratio=Math.min((devicePixelRatio||1)*(window.visualViewport?.scale||1),3);
  const ancho=Math.max(1,Math.round(caja.width*ratio));
  const alto=Math.max(1,Math.round(caja.height*ratio));
  if(lienzo.width!==ancho || lienzo.height!==alto) {
   lienzo.width=ancho;
   lienzo.height=alto;
  }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,ancho,alto);
  // El lápiz y getBoundingClientRect usan las mismas coordenadas de pantalla.
  // Convierte esas coordenadas al espacio real del lienzo, incluso con zoom.
  const escalaX=ancho/caja.width, escalaY=alto/caja.height;
  ctx.setTransform(escalaX,0,0,escalaY,-caja.left*escalaX,-caja.top*escalaY);
  ctx.save();
  const opacidad=ajustes.opacidad/100;
  for(const paso of trazos){
   const {puntos,ultimo,config}=paso;
   const efecto=config.borrado==='auto'?(config.estilo==='fine'?'smooth':'tail'):config.borrado;
   const opacidadTrazo=config.opacidad/100;
   const duracionTrazo=config.duracion*1000;
   if(efecto==='keep') {
    linea(puntos,opacidadTrazo,1,0,config);
    continue;
   }
   if(efecto==='tail'){
    while(puntos.length>1 && ahora-puntos[1].tiempo>=duracionTrazo) puntos.shift();
    const grupos=new Map();
    for(let n=0;n<puntos.length;n++){
     const p=puntos[n];
     const alpha=Math.round(16*limitar((1-(ahora-p.tiempo)/duracionTrazo)/.45))/16;
     if(!alpha) continue;
     const previo=puntos[Math.max(0,n-1)];
     const grupo=grupos.get(alpha);
     if(grupo) grupo.puntos.push(p);
     else grupos.set(alpha,{puntos:previo===p?[p]:[previo,p],distancia:previo.distancia});
    }
    for(const [alpha,g] of grupos) linea(g.puntos,opacidadTrazo*alpha,1,g.distancia,config);
   }else{
    const edad=paso===trazo && gesto ? 0 : ahora-ultimo;
    const restante=limitar(1-edad/duracionTrazo);
    const alpha=efecto==='cut'?Number(restante>0):limitar(restante/.7);
    linea(puntos,opacidadTrazo*alpha,efecto==='thin'?alpha:1,0,config);
   }
  }
  trazos=trazos.filter(paso=>paso.config.borrado==='keep'||(paso===trazo && gesto)||ahora-paso.ultimo<paso.config.duracion*1000);
  if(trazo&&!trazos.includes(trazo)) trazo=undefined;
  destellosEnLaPunta();
  if(punto){
   const restante=punto.fijo?1:limitar(1-(ahora-punto.tiempo)/duracion());
   ctx.globalAlpha=opacidad*limitar(restante/.3);
   ctx.fillStyle=ajustes.color;
   ctx.shadowColor=ajustes.color;
   ctx.shadowBlur=8;
   ctx.strokeStyle='#fff';
   ctx.lineWidth=1.5;
   ctx.beginPath();
   ctx.arc(punto.x,punto.y,ajustes.ancho/2,0,Math.PI*2);
   ctx.fill();
   ctx.stroke();
   if(!restante) punto=undefined;
  }
  ctx.restore();
  if(trazos.some(paso=>paso.config.borrado!=='keep') || (punto&&!punto.fijo)) pedirCuadro();
 }
 function colocar(x,y,fijo=false) {
  const tiempo=performance.now();
  if(ajustes.modo==='dot') punto={x,y,tiempo,fijo};
  else {
   if(!trazo || (!gesto && tiempo-trazo.ultimo>=duracion())){
    const config={...ajustes};
    if(!efectosDisponibles()) {
     config.tinta='solid';
     config.adorno='none';
    }
    trazo={puntos:[],ultimo:tiempo,config};
    trazos.push(trazo);
   }
   const anterior=trazo.puntos.at(-1);
   const distancia=anterior?anterior.distancia+Math.hypot(x-anterior.x,y-anterior.y):0;
   if(!anterior || x!==anterior.x || y!==anterior.y) trazo.puntos.push({x,y,tiempo,distancia});
   trazo.ultimo=tiempo;
  }
  pedirCuadro();
 }
 function salir() {
  if(trazo?.config.borrado==='keep') pedirCuadro();
  trazo=undefined;
  if(punto?.fijo) {
   punto.fijo=false;
   punto.tiempo=performance.now();
   pedirCuadro();
  }
 }
 const controles='a,button,input,textarea,select,summary,label,[contenteditable]';
 document.addEventListener('pointerdown',e=>{
  if(!activo || gesto || !dibujaCon(e.pointerType) || e.button!==0 || barra.contains(e.target)) return;
  const control=e.target.closest(controles);
  if(control?.matches('textarea,select,[contenteditable],input:not([type=radio]):not([type=checkbox]):not([type=button]):not([type=submit])')) return;
  clearTimeout(temporizadorClic);
  suprimirClic=false;
  gesto={id:e.pointerId,x:e.clientX,y:e.clientY,sobreControl:Boolean(control)};
  if(!control) {
   e.preventDefault();
   superficie.setPointerCapture(e.pointerId);
   suprimirClic=true;
  }
  colocar(e.clientX,e.clientY,true);
 });
 // iPadOS distingue el lápiz del dedo en los eventos táctiles.
 // Cancela el desplazamiento del lápiz sin bloquear los gestos con el dedo.
 for(const tipo of ['touchstart','touchmove']) document.addEventListener(tipo,e=>{
  if(!gesto || (tipo==='touchstart' && gesto.sobreControl)) return;
  if(e.cancelable && Array.from(e.changedTouches).some(touch=>touch.touchType==='stylus')) e.preventDefault();
 },{passive:false});
 document.addEventListener('pointermove',e=>{
  if(!activo || gesto?.id!==e.pointerId) return;
  if(Math.hypot(e.clientX-gesto.x,e.clientY-gesto.y)>6) suprimirClic=true;
  colocar(e.clientX,e.clientY,true);
 });
 document.addEventListener('dragstart',e=>{if(gesto) e.preventDefault();});
 for(const tipo of ['pointerup','pointercancel','lostpointercapture']) document.addEventListener(tipo,e=>{
  if(gesto?.id!==e.pointerId) return;
  gesto=undefined;
  salir();
  temporizadorClic=setTimeout(()=>{suprimirClic=false;},0);
 });
 document.addEventListener('click',e=>{
  if(suprimirClic && e.detail>0 && (!e.pointerType || dibujaCon(e.pointerType))){e.preventDefault();e.stopPropagation();}
 },true);
 document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!panel.hidden) {
   mostrarAjustes(false);
   abrirAjustes.focus({preventScroll:true});
  }
  if(activo) limpiar();
 });
 window.addEventListener('blur',limpiar);
 for(const evento of ['resize','scroll','hashchange','beforeprint']) window.addEventListener(evento,limpiar);
 for(const evento of ['resize','scroll']) window.visualViewport?.addEventListener(evento,limpiar);
 barra.removeAttribute('hidden');
 actualizarAjustes();
})();

</script>
